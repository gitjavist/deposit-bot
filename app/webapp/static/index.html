<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои вклады 2</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>

<div class="topbar">

    <div class="title">
        💰 Вклады 2
    </div>

</div>

<div id="debug"></div>

<div class="header">

    <h1>💰 Мои вклады 3</h1>

<div class="summary">

    <div class="summary-card green">
        <div class="label">💰 Общая сумма</div>
        <div class="value" id="totalAmount">0 ₽</div>
    </div>

    <div class="summary-card blue">
        <div class="label">📈 Доход в год</div>
        <div class="value" id="totalIncome">0 ₽</div>
    </div>

    <div class="summary-card purple">
        <div class="label">📊 Кол-во вкладов</div>
        <div class="value" id="depositsCount">0</div>
    </div>

</div>

    <div class="portfolio" id="portfolio"></div>

</div>

<button id="showFormBtn">
    ➕ Добавить вклад
</button>

<div id="depositForm" style="display:none;">

    <input
        id="bank"
        placeholder="Банк">

    <input
        id="depositName"
        placeholder="Название вклада">

    <input
        id="amount"
        placeholder="Сумма">

    <input
        id="rate"
        placeholder="Ставка">

    <input
        id="months"
        placeholder="Срок (мес.)">

    <label>
        <input
            type="checkbox"
            id="capitalization">
        Капитализация
    </label>

    <button id="saveDepositBtn">
        Сохранить
    </button>

</div>

<div id="deposits"></div>

<script src="/static/app.js?v=1"></script>

</body>
</html>
